<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NX 3D Viewer</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-mark" aria-hidden="true">NX</div>
      <div class="app-title">
        <h1>NX 3D Viewer</h1>
        <p>Local model visualization</p>
      </div>
      <div class="connection" role="status" aria-live="polite">
        <span class="connection-dot" id="connection-dot"></span>
        <span id="connection-label">Connecting…</span>
      </div>
    </header>
    <main class="workspace" aria-label="3D workspace">
      <div class="workspace-content">
        <div class="workspace-icon" aria-hidden="true">◇</div>
        <h2>3D workspace</h2>
        <p>Model visualization will be available in the next milestone.</p>
      </div>
    </main>
  </div>
</body>
</html>
